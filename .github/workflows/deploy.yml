name: Build and Deploy to ECS

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: devops-challenge-app
  ECS_SERVICE: devops-challenge-service
  ECS_CLUSTER: devops-challenge-cluster
  ECS_TASK_DEFINITION: devops-challenge-task
  CONTAINER_NAME: app

jobs:
  deploy:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure AWS Credentials (via OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
        audience: sts.amazonaws.com

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      run: |
        set -e
        
        # 1. Hardcoded ECR URL based on your AWS Account ID
        ECR_REGISTRY="227281812481.dkr.ecr.us-east-1.amazonaws.com"
        IMAGE_URI="${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
        
        echo "Full Image URI: $IMAGE_URI"
        
        # 2. Authenticate Docker
        aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin $ECR_REGISTRY
        
        # 3. Build and push
        cd app
        docker build -t $IMAGE_URI .
        docker push $IMAGE_URI
        
        # 4. Save for next step
        echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

    - name: Download Task Definition and Update Image/Env
      id: update-task
      run: |
        # 1. Download the current task definition
        aws ecs describe-task-definition --task-definition ${{ env.ECS_TASK_DEFINITION }} --query taskDefinition > task-def.json
        
        # 2. Update the image and environment variable using jq
        jq --arg IMAGE "${{ env.IMAGE_URI }}" --arg VERSION "${{ github.sha }}" \
           '.containerDefinitions[0].image = $IMAGE | .containerDefinitions[0].environment = [{"name": "APP_VERSION", "value": $VERSION}] | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
           task-def.json > new-task-def.json
           
        # 3. Register the new task definition
        aws ecs register-task-definition --cli-input-json file://new-task-def.json > register-output.json
        NEW_REVISION=$(jq -r '.taskDefinition.revision' register-output.json)
        echo "NEW_REVISION=$NEW_REVISION" >> $GITHUB_ENV

    - name: Deploy to ECS
      run: |
        aws ecs update-service \
          --cluster ${{ env.ECS_CLUSTER }} \
          --service ${{ env.ECS_SERVICE }} \
          --task-definition ${{ env.ECS_TASK_DEFINITION }}:${{ env.NEW_REVISION }} \
          --force-new-deployment
